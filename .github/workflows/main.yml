name: Upload changed files to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # A nivel de job para que el `if:` del paso de invalidacion pueda leerlo:
    # el contexto `secrets` no esta disponible dentro de un `if:` de paso.
    env:
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Este repo es un workspace pnpm (no npm): el `preinstall` del package.json
    # raiz aborta si el agente no es pnpm, y no existe package-lock.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.3.0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build site
      # PORT y BASE_PATH son obligatorios: vite.config.ts lanza error si faltan.
      # El build sale en artifacts/platform/dist/public (ver build.outDir).
      env:
        PORT: 8083
        # La app se sirve desde <host>/carwash/, no desde la raiz. Vite lo
        # quiere con barra final; de ahi sale import.meta.env.BASE_URL, que
        # App.tsx le pasa como base al router de wouter. Tiene que coincidir
        # con `apps` de la entrada de este host en la CloudFront function.
        BASE_PATH: /carwash/
        NODE_ENV: production
      run: pnpm --filter @workspace/platform run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Sync dist to S3
      # Cada app vive en su propio prefijo del bucket. Sin AWS_S3_PATH las
      # tres sincronizan sobre la raiz y, con --delete, se borran entre si;
      # por eso ese vacio aborta el deploy.
      env:
        AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        AWS_S3_PATH: ${{ vars.AWS_S3_PATH }}
        ENV_PROD: ${{ vars.ENV_PROD }}
      run: |
        # main es la unica rama que dispara este workflow, asi que hoy siempre
        # resuelve a prod. El case queda explicito para que sumar una rama de
        # staging sea agregar un renglon y no reescribir el step.
        case "$GITHUB_REF_NAME" in
          main) ENV_PREFIX="$ENV_PROD" ;;
          *)
            echo "::error::La rama $GITHUB_REF_NAME no tiene entorno asignado."
            exit 1
            ;;
        esac

        # Trim de espacios, puntos y barras sobrantes, asi da igual como se
        # haya cargado la variable ("dev", "dev.", " /app/carwash/ ", etc).
        trim() { printf '%s' "$1" | tr -d '[:space:]'; }
        PREFIX="$(trim "$AWS_S3_PATH")"; PREFIX="${PREFIX#/}"; PREFIX="${PREFIX%/}"
        ENV_PREFIX="$(trim "$ENV_PREFIX")"; ENV_PREFIX="${ENV_PREFIX%.}"

        if [ -z "$PREFIX" ]; then
          echo "::error::AWS_S3_PATH no esta definida. Abortando: sincronizar sobre la raiz del bucket con --delete borraria las otras apps."
          exit 1
        fi

        # El entorno es un prefijo del NOMBRE del bucket, no una carpeta:
        # dev -> s3://dev.fremihome-carwash/<path>/. ENV_PROD esta vacia a
        # proposito, asi prod usa el bucket pelado.
        BUCKET="$AWS_S3_BUCKET"
        if [ -n "$ENV_PREFIX" ]; then
          BUCKET="$ENV_PREFIX.$AWS_S3_BUCKET"
        fi

        DEST="s3://$BUCKET/$PREFIX/"
        echo "Sincronizando a $DEST"
        aws s3 sync artifacts/platform/dist/public/ "$DEST" --delete

    - name: Invalidate CloudFront
      # Sin esto el deploy queda invisible: CloudFront cachea una variante por
      # Accept-Encoding y la comprimida (la que pide todo navegador) sigue
      # sirviendo lo viejo hasta que expire su TTL.
      # Se salta solo si todavia no existe el secret, para no romper el deploy.
      if: env.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
          --paths "/*"
